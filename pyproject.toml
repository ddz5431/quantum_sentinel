[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-sentinel"
version = "0.1.0"
description = "Entropy-guided logical decoherence control for LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate",
    "tqdm",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]